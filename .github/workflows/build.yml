name: Build API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore TaskTracker.Api/TaskTracker.Api.csproj
      - run: dotnet build TaskTracker.Api/TaskTracker.Api.csproj --no-restore --configuration Release
